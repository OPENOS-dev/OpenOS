syntax = "proto3";

package chromiumos.test.api.metadata;

option go_package = "go.chromium.org/chromiumos/config/go/test/api/metadata";

import "chromiumos/test/artifact/test_result.proto";

// NEXT TAG: 10
message PublishAntsMetadata {
  enum ATPEnvironment {
    ENV_UNKNOWN = 0;
    ENV_STAGING = 1;
    ENV_PROD = 2;
  }
  // The invocation id of the overall ANTS invocation.
  string ants_invocation_id = 1;

  // The work unit id of the parent work unit underlying all the modules.
  string parent_work_unit_id = 2;

  // Partner account id.
  string account_id = 3;

  // Execution information associated with this run. Re-using one from classic.
  // But, we will be only looking at buildbucket and dut information.
  chromiumos.test.artifact.ExecutionInfo primary_execution_info = 4;

  // The current luci invocation id. This does not include parent/child
  // invocations or any other bb info.
  // TODO(srinivashegde): Add more bb details when ready.
  string luci_invocation_id = 5;

  // The metadata required to schedule the test(s) within the same invocation.
  chromiumos.test.artifact.SchedulingMetadata scheduling_metadata = 6;

  // The android env to talk to.
  ATPEnvironment atp_environment = 7;

  // Indicates whether TF AnTS Plugin is enabled, if enabled
  // skip uploading test artifacts and results generated by TF plugin.
  // But, uploads only CFT containers (eg. provision, servo-nexus etc)
  // generated artifacts.
  bool is_tf_plugin_enabled = 8;

  // Indicate whether it should call AnTS V4.
  bool is_ants_v4_enabled = 9;
}
