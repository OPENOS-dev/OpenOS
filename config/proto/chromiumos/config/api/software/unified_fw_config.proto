syntax = "proto3";

option go_package = "go.chromium.org/chromiumos/config/go/api/software";

package chromiumos.config.api.software;

// Represents the standardized firmware configuration bitfields, unpacked into
// individual fields. This configuration is used by the AP/EC firmware at boot
// time to adapt to different hardware components.
message FirmwareConfig {
  uint32 audio_codec = 1;
  uint32 audio_amplifier = 2;
  uint32 audio_bus_type = 3;
  uint32 camera_ufc_type = 4;
  uint32 camera_ufc_name = 5;
  uint32 camera_wfc_type = 6;
  uint32 camera_wfc_name = 7;
  uint32 storage_type = 8;
  uint32 sd_card_controller = 9;
  uint32 touchscreen = 10;
  uint32 touchscreen_probe_type = 11;
  uint32 touchscreen_soc_interface = 12;
  uint32 sensor_hub = 13;
  uint32 fingerprint_interface = 14;
  uint32 wifi_interface = 15;
  uint32 trackpad = 16;
  uint32 trackpad_probe_type = 17;
  uint32 trackpad_soc_interface = 18;
  uint32 cellular_interface = 19;
  uint32 form_factor = 20;
  uint32 keyboard_layout = 21;
  uint32 panel_id = 22;
  uint32 stylus = 23;
  uint32 kb_backlight = 24;
  uint32 kb_num_pad = 25;
  uint32 thermal_fan = 26;
  uint32 lid_sensor = 27;
  uint32 base_sensor = 28;
  uint32 tablet_mode_base_orientation = 29;
  uint32 charger_chip = 30;
  uint32 pdc_chip_vendor_port_0 = 31;
  uint32 pdc_chip_vendor_port_1 = 32;
  uint32 pdc_chip_vendor_port_2 = 33;
  uint32 pdc_chip_vendor_port_3 = 34;
  uint32 ap_oem_3bit_field0 = 35;
  uint32 ap_oem_2bit_field0 = 36;
  uint32 ap_oem_2bit_field1 = 37;
  uint32 ap_oem_1bit_field0 = 38;
  uint32 ec_oem_3bit_field0 = 39;
  uint32 ec_oem_2bit_field0 = 40;
  uint32 ec_oem_2bit_field1 = 41;
  uint32 ec_oem_1bit_field0 = 42;
}

message UnifiedFirmwareConfig {
  repeated uint32 value = 1;
}
