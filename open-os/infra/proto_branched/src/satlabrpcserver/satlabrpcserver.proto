// NEXT_TAG = 4
message ListDutTasksRequest {
  // the IP address of DUT
  string address = 1;

  // A page token, received from the previous `ListDUTEvents` call.
  // Provide this, to retrieve the subsequent page.
  string page_token = 2;

  // The maximum number of events to return
  // if unspecified, at most 30 events will be returned
  int32 page_size = 3;
}

// NEXT_TAG = 7
message Task {
  string id = 1;
  google.protobuf.Timestamp start_at = 2;
  float duration = 3;
  string url = 4;
  bool is_success = 5;
  string name = 6;
}

// NEXT_TAG = 4
message ListDutTasksResponse {
  // A page token, the next token for retrieving the subsequent page.
  // if it is empty, means it is at the end, no more plans
  // that we can read from the bucket
  string next_page_token = 1;

  repeated Task tasks = 2;
}

// NEXT_TAG = 4
message ListDutEventsRequest {
  // the IP address of DUT
  string address = 1;

  // A page token, received from the previous `ListDUTEvents` call.
  // Provide this, to retrieve the subsequent page.
  string page_token = 2;

  // The maximum number of events to return
  // if unspecified, at most 30 events will be returned
  int32 page_size = 3;
}

// NEXT_TAG = 7
message BotEvent {
  string msg = 1;
  string event_type = 2;
  google.protobuf.Timestamp created_at = 3;
  string task_id = 4;
  string task_link = 5;
  string version = 6;
}

// NEXT_TAG = 3
message ListDutEventsResponse {
  // A page token, the next token for retrieving the subsequent page.
  // if it is empty, means it is at the end, no more plans
  // that we can read from the bucket
  string next_page_token = 1;

  repeated BotEvent events = 2;
}

// NEXT_TAG = 12
message RunTestRequest {
  repeated string tests = 1;
  string test_args = 2;
  string board = 3;
  string model = 4;
  string milestone = 5;
  string build = 6;
  string pool = 7;
  // We use `repeated Dim` (not `map<string, string>`) in here
  // because the generated files in Typescript do not
  // have a setter function.
  repeated Dim dims = 8;
  bool cft = 9;
  bool trv2 = 10;
  bool upload_to_cpcon = 11;
}
// NEXT_TAG = 2
message RunTestResponse { string build_link = 1; }

// NEXT_TAG = 1
message ListEnrolledDutsRequest {}

// NEXT_TAG = 18
message Dut {
  string address = 1;
  string name = 2;
  string hostname = 3;
  string board = 4;
  string model = 5;
  repeated string pools = 6;
  string mac_address = 7;
  bool is_pingable = 8;
  string servo_serial = 9;
  string servo_type = 10;
  int32 servo_port = 11;
  string state = 12;
  bool has_test_image = 13;
  BotInfo bot_info = 14;
  string ccd_status = 15;
  // If the board is granted, returns True.
  // Otherwise returns False.
  bool has_permission = 16;
  bool has_android_desktop_image = 17;
}

// NEXT_TAG = 5
message BotInfo {
  // NEXT_TAG = 6
  enum BotState {
    NO_STATE_SET = 0;
    ALIVE = 1;
    BUSY = 2;
    DEAD = 3;
    QUARANTINED = 4;
    IDLE = 5;
  }

  BotState bot_state = 1;
  // Link to the current running task.
  string current_task = 2;
  // Name of the task currently running (Test/Repair/Deploy).
  string task_name = 3;
  // Dimensions of the bot
  repeated StringListPair dimensions = 4;
}

// NEXT_TAG = 2
message ListEnrolledDutsResponse { repeated Dut duts = 1; }

// NEXT_TAG = 1
message ListDutsRequest {}

// NEXT_TAG = 2
message ListDutsResponse { repeated Dut duts = 1; }

// NEXT_TAG = 2
