syntax = "proto3";

package satlabrpcserver;

option go_package = "go.chromium.org/chromiumos/infra/proto/satlabrpcserver";

import "google/protobuf/timestamp.proto";
import "test_platform/request.proto";
import "chromiumos/longrunning/operations.proto";
import "chromiumos/test/api/servod_service.proto";
import "chromiumos/test/api/devboard_service.proto";

service SatlabRpcService {
  rpc ListAccessibleModels(ListAccessibleModelsRequest)
      returns (ListAccessibleModelsResponse);
  rpc ListBuildVersions(ListBuildVersionsRequest)
      returns (ListBuildVersionsResponse);
  rpc StageBuild(StageBuildRequest) returns (StageBuildResponse);
  rpc ListConnectedDutsFirmware(ListConnectedDutsFirmwareRequest)
      returns (ListConnectedDutsFirmwareResponse);
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);
  rpc GetVersionInfo(GetVersionInfoRequest) returns (GetVersionInfoResponse);
  rpc GetNetworkInfo(GetNetworkInfoRequest) returns (GetNetworkInfoResponse);
  rpc GetPeripheralInformation(GetPeripheralInformationRequest)
      returns (GetPeripheralInformationResponse);
  rpc UpdateDutsFirmware(UpdateDutsFirmwareRequest)
      returns (UpdateDutsFirmwareResponse);

  // Run Suite
  rpc ListBuildTargets(ListBuildTargetsRequest)
      returns (ListBuildTargetsResponse);
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);
  rpc ListTestPlans(ListTestPlansRequest) returns (ListTestPlansResponse);
  rpc GetTestPlan(GetTestPlanRequest) returns (GetTestPlanResponse);
  rpc Topology(TopologyRequest) returns (TopologyResponse);
  rpc AddTopology(AddTopologyRequest) returns (AddTopologyResponse);
  rpc DeleteTopology(DeleteTopologyRequest) returns (DeleteTopologyResponse);

  // Android Desktop
  rpc ListAndroidBranches(ListAndroidBranchesRequest) returns (ListAndroidBranchesResponse);
  rpc ListAndroidTargets(ListAndroidTargetsRequest) returns (ListAndroidTargetsResponse);
  rpc ListAndroidTestModules(ListAndroidTestModulesRequest) returns (ListAndroidTestModulesResponse);
  rpc ListAndroidBuilds(ListAndroidBuildsRequest) returns (ListAndroidBuildsResponse);
  rpc ListAndroidSuites(ListAndroidSuitesRequest) returns (ListAndroidSuitesResponse);
  rpc ValidateAndroidBuild(ValidateAndroidBuildRequest) returns (ValidateAndroidBuildResponse);
  rpc RunAndroidLabqual (RunAndroidLabqualRequest) returns (RunAndroidLabqualResponse);
  rpc ListDrive (ListDriveRequest) returns (ListDriveResponse);

  // Autoqual
  rpc ListTestEfforts(ListTestEffortsRequest) returns (ListTestEffortsResponse);
  rpc CancelTestEffort(CancelTestEffortRequest) returns (CancelTestEffortResponse);
  rpc CreateTestEffort(CreateTestEffortRequest) returns (CreateTestEffortResponse);

  // services to run different types of test suites
  rpc RunSuite(RunSuiteRequest) returns (RunSuiteResponse);
  rpc RunTest(RunTestRequest) returns (RunTestResponse);
  rpc RunTestPlan(RunTestPlanRequest) returns (RunTestPlanResponse);
  rpc RunStorageQual(RunStorageQualRequest) returns (RunStorageQualResponse);
  rpc RunQualification(RunQualificationRequest)
      returns (RunQualificationResponse);
  rpc RunLabQual (RunLabQualRequest) returns (RunLabQualResponse);
  rpc Run (RunRequest) returns (RunResponse);

  // manage DUTs
  rpc AddPool(AddPoolRequest) returns (AddPoolResponse);
  rpc UpdatePool(UpdatePoolRequest) returns (UpdatePoolResponse);
  rpc DeleteDuts(DeleteDutsRequest) returns (DeleteDutsResponse);
  rpc AddDuts(AddDutsRequest) returns (AddDutsResponse);
  rpc RepairDuts(RepairDutsRequest) returns (RepairDutsResponse);
  rpc OpenCCD(OpenCCDRequest) returns (stream OpenCCDReply);
  rpc SendMessageToCCDSession(SendMessageToCCDSessionRequest) returns (SendMessageToCCDSessionResponse);
  rpc StableVersion(StableVersionRequest) returns (StableVersionResponse);
  rpc UpdateDevice(UpdateDeviceRequest) returns (UpdateDeviceResponse);
  rpc Testlab(TestlabRequest) returns (TestlabResponse);

  // get DUTs information
  rpc GetDutDetail(GetDutDetailRequest) returns (GetDutDetailResponse);
  rpc ListDutTasks(ListDutTasksRequest) returns (ListDutTasksResponse);
  rpc ListDutEvents(ListDutEventsRequest) returns (ListDutEventsResponse);
  rpc ListEnrolledDuts(ListEnrolledDutsRequest)
      returns (ListEnrolledDutsResponse);
  rpc ListDuts(ListDutsRequest) returns (ListDutsResponse);

  // setup
  rpc SetCloudConfiguration(SetCloudConfigurationRequest)
      returns (SetCloudConfigurationResponse);
  rpc GetCloudConfiguration(GetCloudConfigurationRequest)
      returns (GetCloudConfigurationResponse);
  rpc IsAuth (IsAuthRequest) returns (IsAuthResponse);
  rpc DutWifiInfo (DutWifiInfoRequest) returns (DutWifiInfoResponse);
  rpc SetDutWifiInfo (SetDutWifiInfoRequest) returns (SetDutWifiInfoResponse);

  // system
  rpc Reboot(RebootRequest) returns (RebootResponse);
  rpc UploadLog(UploadLogRequest) returns (UploadLogResponse);
  rpc DownloadLog(DownloadLogRequest) returns (stream DownloadLogResponse);

  // servo
  rpc StartServod(chromiumos.test.api.StartServodRequest)
      returns (chromiumos.longrunning.Operation) {
    option (chromiumos.longrunning.operation_info) = {
      response_type : "StartServodResponse",
      metadata_type : "StartServodMetadata"
    };
  }

  // devboard
  rpc StartDevboardService(chromiumos.test.api.StartDevboardServiceRequest)
      returns (chromiumos.longrunning.Operation) {
    option (chromiumos.longrunning.operation_info) = {
      response_type : "chromiumos.test.api.StartDevboardServiceResponse",
      metadata_type : "chromiumos.test.api.StartDevboardServiceMetadata"
    };
  }

  // Jobs/Tasks information
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc DownloadJobLog(DownloadJobLogRequest) returns (DownloadJobLogResponse);
  rpc CheckDownloadJobLogStatus(CheckDownloadJobLogStatusRequest) returns (CheckDownloadJobLogStatusResponse);
  rpc JobLogLink(JobLogLinkRequest) returns (JobLogLinkResponse);
  rpc ListJobLogTasks(ListJobLogTasksRequest) returns (ListJobLogTasksResponse);

  // Jobs operation
  rpc AbortJobs(AbortJobsRequest) returns (AbortJobsResponse);

  // Satlab update
  rpc IsUpdateAvailable (IsUpdateAvailableRequest) returns (IsUpdateAvailableResponse);
}

message StartServodResponse {
  // Empty response for success.
  message Success {}

  // Error message for failure.
  message Failure { string error_message = 1; }

  oneof result {
    Success success = 1;
    Failure failure = 2;
  }
}

message StartServodMetadata {}

message ListBuildTargetsRequest {}

