syntax = "proto3";

package auto_qual;

option go_package = "go.chromium.org/chromiumos/infra/proto/go/auto_qual";

message AndroidBuildTarget {
  // Represents the name of a configured branch in the Android Build system
  // (Busytown).
  //
  // These branches are typically defined in GCL files under
  // google3/configs/wireless/android/busytown/. The value of this field
  // should match the branch name used in the Android Build system interfaces
  // like go/ab.
  //
  // Examples:
  // - `git_main`
  // - `git_main-throttled`
  // - `git_desktop-trunk-release`
  // - `git_25Q2-desktop-release`
  //
  // Defaults to `git_main-throttled`.
  string busytown_branch_name = 1;

  // Specifies the release configuration of the build target.
  //
  // This typically corresponds to the middle part of a lunch target string,
  // for example, the "trunk_staging" in "brya-trunk_staging-eng".
  //
  // Common values include:
  // - `next`
  // - `trunk`
  // - `trunk_staging`
  //
  // Defaults to `trunk_staging` if `build_variant` isn't set, or "" if
  // `build_variant` is set.
  string release_configuration = 2;

  // Specifies the build variant for the target.
  //
  // This typically corresponds to the last part of a lunch target string,
  // for example, the "userdebug" in "brya-trunk_staging-userdebug".
  //
  // Common values are:
  // - `user`
  // - `userdebug`
  // - `eng`
  //
  // Defaults to `userdebug`
  string build_variant = 3;

  // Product name of the build target.
  //
  // Supports string formatting with {board} and {model}.
  // If left empty, it defaults to the board name.
  //
  // This typically corresponds to the first part of a lunch target string,
  // for example, the "brya" in "brya-trunk_staging-eng".
  //
  // Examples:
  // - "{board}" -> "brya"
  // - "{model}" -> "navi"
  // - "{board}_corp" -> "brya_corp"
  string product_name = 4;

  // Specifies the Build ID to be used.
  //
  // This is the specific Build ID targeted to test against.
  string build_id = 5;
}

message ChromeosBuildTarget {
  uint32 target_milestone_number = 1;
  string branch_name = 2;
}

// Specifies the Operating System build targets to test against.
message OSBuildTarget {
  oneof os {
    // Test against an Android build.
    AndroidBuildTarget android = 1;

    // Test against a ChromeOS build.
    ChromeosBuildTarget chromeos = 2;
  }
}
