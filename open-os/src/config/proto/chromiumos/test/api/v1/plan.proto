syntax = "proto3";

package chromiumos.test.api.v1;

option go_package = "go.chromium.org/chromiumos/config/go/test/api/v1;test_api_v1";

import "chromiumos/test/api/coverage_rule.proto";

// A hardware test plan is composed of coverage rules
message HWTestPlan {
  // Unique name to identify the test plan, recommend reverse domain name
  // rooted at chromeos:
  //   chromeos.release.wifi....
  message TestPlanId {
    string value = 1;
  }

  TestPlanId id = 1;
  repeated CoverageRule coverage_rules = 2;
}

message VMTestPlan {
  // Unique name to identify the test plan, recommend reverse domain name
  // rooted at chromeos:
  //   chromeos.release.wifi....
  message TestPlanId {
    string value = 1;
  }

  TestPlanId id = 1;
  repeated CoverageRule coverage_rules = 2;
}
