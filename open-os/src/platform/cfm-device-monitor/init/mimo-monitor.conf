description   "Start the mimo-monitor"
author        "chromium-os-dev@chromium.org"

start on starting system-services
stop on stopping system-services
respawn
respawn limit 3 10

expect fork
oom score -100

# -e Enter new network namespace.
# -i Exit immediately after fork (do not act as init).
# -l Enter new IPC namespace.
# -p Enter new pid namespace
# -n Set no_new_privs
# -t Create a tmpfs for /tmp
# Mount /proc, /sys, /dev so that USB devices can be discovered.
# Also mount /run/dbus to communicate with D-Bus.
exec minijail0 -u cfm-monitor -g cfm-peripherals \
  -e -i -l -p -n -t \
  -P /mnt/empty -b / -b /proc -b /sys -b /dev \
  -k '/run,/run,tmpfs,MS_NODEV|MS_NOEXEC|MS_NOSUID,mode=755,size=10M' \
  -b /run/dbus \
  -- /usr/sbin/mimo-monitor
