[Hook Scripts]
cros format = cros format --check --exclude "*.json" --exclude "*/third_party/*" --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}
cros lint = cros lint --exclude "*/third_party/*" --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}
test: ./tools/run_tests.py --no-verbose --no-docker ${PRESUBMIT_FILES}

[Hook Overrides]
cros_license_check: true
long_line_check: true

[Hook Overrides Options]
cros_license_check: --exclude_regex=(\.ssh/authorized_keys|user_settings.py|PKGBUILD|third_party/.*|borealis-historic-mirror|archdb_checksums)$
long_line_check: --exclude_regex=(\.ssh/authorized_keys|PKGBUILD|third_party/.*|archdb_checksums)$
stray_whitespace_check: --exclude_regex=third_party/.*
cargo_clippy_check:
  --project=build/detailed_metrics
