[metadata]
name = bdt
version = 0.0.1
description = Borealis Dev Tool
classifiers =
    Programming Language :: Python :: 3

[options]
package_dir =
    = src
packages = find:
install_requires=
    google-auth-oauthlib
python_requires = >=3.6

[options.packages.find]
where = src

[options.package_data]
* = *.json
