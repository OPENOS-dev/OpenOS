[package]
name = "detailed_metrics"
description = "Borealis Detailed/Debug Metric Collector"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"

[profile.release]
# Strip line numbers etc (about 3.5MB of debug info) from the
# binary, but leave enough that backtraces can still print
# function names.
strip = "debuginfo"
# Link-time optimization, which reduces binary size by ~0.5MB.
lto = true

[dependencies]
clap = { version = "3.2.16", features = ["derive"] }
regex = "1.6.0"
serde_json = "1.0.93"
lazy_static = "1.4.0"
glob = "0.3.1"
