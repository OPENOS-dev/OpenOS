description: |
  Support data to reset an NPCX chip in bootloader mode.

compatible: "cros,npcx-boot"

include: pinctrl-device.yaml

properties:
  pinctrl-0:
    required: true

  pinctrl-1:
    required: true

  pinctrl-names:
    required: true

  npcx-boot-gpios:
    type: phandle-array
    required: true
