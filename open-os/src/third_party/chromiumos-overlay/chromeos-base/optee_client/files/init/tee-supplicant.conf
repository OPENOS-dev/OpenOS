description      "Op-Tee supplicant client"
author           "chromium-os-dev@chromium.org"

# Starts the Op-Tee tee-supplicant daemon which is used to provide client side
# services (such as a filesystem and plugins) to the Op-Tee secure OS on ARM.
start on started system-services and started tpm_managerd
stop on stopping system-services

# Respawn the daemon on crashes.
respawn

oom score -100

script
  # Check if the Widevine RoT certificate has changed, this occurs on device
  # renewal. When this occurs, the storage encryption key has changed and we
  # need to wipe the TEE device storage.
  SPACE_INDEX="0x3fff05"
  PRIOR_CERT_FILE="/var/lib/oemcrypto/prior_wv_cert"
  CURR_CERT_FILE="/var/lib/oemcrypto/curr_wv_cert"
  tpm_manager_client read_space --index=0x3fff07 --file="${CURR_CERT_FILE}" > \
      /dev/null
  if [ -f "${PRIOR_CERT_FILE}" ] &&
      ! diff -q "${PRIOR_CERT_FILE}" "${CURR_CERT_FILE}" > /dev/null; then
    logger -t "${UPSTART_JOB}" "Wiping tee storage on device renewal"
    if ! systemd-tmpfiles --create --remove --clean \
        /usr/lib/tmpfiles.d/on-demand/tee-supplicant-wipe.conf; then
      logger -t "${UPSTART_JOB}" "Failed wiping tee storage after renewal"
      stop
      exit 1
    fi
  fi

  cd /var/lib/oemcrypto
  if [ "$(readlink -f .)" = "/var/lib/oemcrypto" ]; then
    if ! mv "${CURR_CERT_FILE}" "${PRIOR_CERT_FILE}"; then # croslint: disable
      logger -t "${UPSTART_JOB}" "Failed moving curr to prior cert"
    fi
  fi

  # Start constructing minijail0 args...
  args=""

  # Enter a new mount namespace.
  args="${args} -v"

  # Use a minimalistic mount namespace.
  args="${args} --profile minimalistic-mountns"

  # Enter a new IPC namespace.
  args="${args} -l"

  # Enter a new PID namespace.
  args="${args} -p"

  # Enter a new UTS namespace.
  args="${args} --uts"

  # Drop all capabilities and don't allow any new privileges.
  args="${args} -c 0 -n"

  # Change user/group to cdm-oemcrypto.
  args="${args} -u cdm-oemcrypto -g cdm-oemcrypto"

  # Inherit supplementary groups (video).
  args="${args} -G"

  # Set up mount points.
  args="${args} -b /dev/teepriv0,,1"
  args="${args} -k tmpfs,/var,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC"
  args="${args} -k tmpfs,/run,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC"
  args="${args} -b /var/lib/oemcrypto/tee-supplicant,/var/lib/oemcrypto/tee-supplicant,1"
  args="${args} -b /dev/log"
  args="${args} -b /run/dbus"
  args="${args} -b /var/lib/metrics/uma-events,/var/lib/metrics/uma-events,1"

  # Setup command for executing the daemon.
  args="${args} -- /usr/sbin/tee-supplicant"

  exec minijail0 ${args}
end script
