#
# This script disables the GSC strongbox commands.
#
# This upstart script will only be installed when the
# `cr50_onboard` USE flag is set

description     "Disable GSC strongbox commands"
author          "chromium-os-dev@chromium.org"

# This is a short-lived process that really shouldn't fail.
oom score -900

start on stopped cr50-result

script
  status=0

  . "/usr/share/cros/gsc-constants.sh"

  strongbox_disable="$(gsctool_cmd -a --strongbox disable 2>&1)" || status="$?"
  if [ "${status}" != 0 ]; then
    logger -t "${UPSTART_JOB}" \
      "Error: gsctool status $status, output \"${strongbox_disable}\""
    exit 1
  fi
end script
