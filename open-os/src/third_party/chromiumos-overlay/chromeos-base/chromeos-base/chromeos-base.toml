# This file describes the Bazel-specific metadata (go/cros-bazel-metadata).

[bazel]
# This package adds the `root` user with /bin/bash as the shell. user.eclass
# verifies that the shell is installed. Since /bin is cleared when using
# interface layers, we need to disable it.
supports_interface_libraries = false
