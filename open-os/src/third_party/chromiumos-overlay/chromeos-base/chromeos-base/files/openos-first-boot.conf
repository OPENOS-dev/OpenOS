#
# OPENOS first-boot device model setup.
# Runs once on the very first system boot, before user login.
# Reads the device model name from chromeos-config and persists it.

description     "OPENOS first-boot device model setup"
author          "ocs@opencode.studio"

# Run early, before system-services but after boot-services
start on starting system-services

task

script
  DEVICE_MODEL="/var/lib/openos/device-model"

  if [ -f "${DEVICE_MODEL}" ]; then
    exit 0
  fi

  mkdir -p /var/lib/openos

  if [ -f /run/chromeos-config/v1/name ]; then
    cat /run/chromeos-config/v1/name > "${DEVICE_MODEL}"
  else
    hostname > "${DEVICE_MODEL}"
  fi
end script
