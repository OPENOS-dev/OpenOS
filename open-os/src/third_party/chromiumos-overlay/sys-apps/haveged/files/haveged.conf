description     "Entropy Daemon based on the HAVEGE algorithm"
author          "chromium-os-dev@chromium.org"

start on starting boot-services
stop on started system-services
expect fork
oom score 0

env WATERMARK=1024
env HAVEGED_OPTS="-w ${WATERMARK} -v 1"
env PIDFILE=/run/haveged.pid

script
  exec /usr/sbin/haveged ${HAVEGED_OPTS} -p ${PIDFILE} -r 0 ||
	logger -t "${UPSTART_JOB}" "Failed to run haveged."
end script

post-stop script
  entropy_avail="$(cat /proc/sys/kernel/random/entropy_avail)"
  logger -t "${UPSTART_JOB}" \
        "Available entropy after haveged: ${entropy_avail}"
end script
