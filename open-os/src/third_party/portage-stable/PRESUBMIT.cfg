# This sample config file disables all of the ChromiumOS source style checks.
# Comment out the disable-flags for any checks you want to leave enabled.

[Hook Overrides]
# Make sure Manifest files are valid.
manifest_check: true

stray_whitespace_check: false
long_line_check: false
cros_license_check: false
tab_check: false

[Hook Scripts]
cros format = cros format --check --commit ${PRESUBMIT_COMMIT} --exclude "*/*/files/*" --include "*OWNERS*" --include "*/METADATA" --exclude "*" ${PRESUBMIT_FILES}
cros lint = cros lint --commit ${PRESUBMIT_COMMIT} --exclude "*/*/files/*" --include "*OWNERS*" --include "*/METADATA" --exclude "*" ${PRESUBMIT_FILES}
