# OPENOS First-Boot Upstart Job
# Executes once per system lifetime (or after factory reset).
# Only runs when the completed flag is absent.

description   "OPENOS first-boot system initialization"
author        "openos-dev@opencodestudio.org"

# Start right after stateful partition is mounted and boot-services
# milestone is reached — but before Chrome/UI starts.
start on started boot-services

# OOM killer should never touch this critical setup job.
oom never

# One-shot task, exits when done.
task

# Pre-start guard: only run if the flag does not exist.
pre-start script
    FLAG="/mnt/stateful_partition/.openos_boot_completed"
    if [ -f "${FLAG}" ]; then
        logger -t openos-first-boot "First-boot already completed, skipping."
        stop
        exit 0
    fi
end script

script
    # Ensure stateful is writable before proceeding
    mount -o remount,rw /mnt/stateful_partition 2>/dev/null || true

    exec /usr/libexec/openos/openos-first-boot.sh
end script

# After successful execution, tell startup to continue
post-stop script
    initctl emit openos-first-boot-completed || true
end script
