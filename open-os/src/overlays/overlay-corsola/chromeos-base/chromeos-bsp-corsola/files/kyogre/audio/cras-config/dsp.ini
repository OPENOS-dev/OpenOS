[output_source]
library=builtin
label=source
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
output_0={src:0}
output_1={src:1}

[output_sink]
library=builtin
label=sink
purpose=playback
input_0={dst:0}
input_1={dst:1}

[input_source]
library=builtin
label=source
purpose=capture
disable=(not (equal? dsp_name "dmic_eq"))
output_0={in_src:0}
output_1={in_src:1}

[input_sink]
library=builtin
label=sink
purpose=capture
input_0={in_dst:0}
input_1={in_dst:1}

[drc]
library=builtin
label=drc
input_0={src:0}
input_1={src:1}
output_2={intermediate:0}
output_3={intermediate:1}
input_4=1         ; emphasis_disabled
input_5=0         ; f
input_6=0         ; disable
input_7=-28       ; threshold
input_8=30        ; knee
input_9=8         ; ratio
input_10=0.001     ; attack
input_11=0.1       ; release
input_12=1         ; boost
input_13=600       ; f
input_14=0         ; disable
input_15=-28       ; threshold
input_16=30        ; knee
input_17=8         ; ratio
input_18=0.003     ; attack
input_19=0.25      ; release
input_20=2         ; boost
input_21=2000      ; f
input_22=0         ; disable
input_23=-28       ; threshold
input_24=30        ; knee
input_25=6         ; ratio
input_26=0.003     ; attack
input_27=0.25      ; release
input_28=1         ; boost

[eq2]
library=builtin
label=eq2
input_0={intermediate:0}
input_1={intermediate:1}
output_2={dst:0}
output_3={dst:1}
input_4=2       ; highpass
input_5=100     ; freq
input_6=0       ; Q
input_7=0       ; gain
input_8=2       ; highpass
input_9=100     ; freq
input_10=0       ; Q
input_11=0       ; gain

[in_eq2]
library=builtin
label=eq2
input_0={in_src:0}
input_1={in_src:1}
output_2={in_dst:0}
output_3={in_dst:1}
input_4=6       ; peaking
input_5=5000    ; freq
input_6=1      ; Q
input_7=-2      ; gain
input_8=6       ; peaking
input_9=5000    ; freq
input_10=1      ; Q
input_11=-2      ; gain
input_12=6       ; peaking
input_13=9000    ; freq
input_14=1      ; Q
input_15=-9      ; gain
input_16=6       ; peaking
input_17=9000    ; freq
input_18=1      ; Q
input_19=-9      ; gain
