audio-main-common: &audio_main_common
  $cras-root: "/etc/cras"
  $ucm-root: "/usr/share/alsa/ucm"
  $card1: "avs_max98357a"
  $card2: "avs_da7219"
  $card3: "avs_dmic"
  $card4: "hdaudioB0D2"
  cras-config-dir: "{{$cras}}"
  ucm-suffix: "{{$ucm}}"
  $audio-source: "{{cras-config-dir}}/audio-latest"
  $cras-source: "{{$audio-source}}/cras-config"
  $cras-dest: "{{$cras-root}}/{{cras-config-dir}}"
  $ucm-source1: "{{$audio-source}}/ucm-config{{$ucm-source-suffix}}/{{$card1}}"
  $ucm-source2: "{{$audio-source}}/ucm-config{{$ucm-source-suffix}}/{{$card2}}"
  $ucm-source3: "{{$audio-source}}/ucm-config{{$ucm-source-suffix}}/{{$card3}}"
  $ucm-source4: "{{$audio-source}}/ucm-config{{$ucm-source-suffix}}/{{$card4}}"
  $ucm-dest1: "{{$ucm-root}}/{{$card1}}.{{ucm-suffix}}"
  $ucm-dest2: "{{$ucm-root}}/{{$card2}}.{{ucm-suffix}}"
  $ucm-dest3: "{{$ucm-root}}/{{$card3}}.{{ucm-suffix}}"
  $ucm-dest4: "{{$ucm-root}}/{{$card4}}.{{ucm-suffix}}"

  audio-main-files: &audio_main_files
    files-map-card1-settings: &files_map_card1_settings
      source: "{{$cras-source}}/{{$card1}}"
      destination: "{{$cras-dest}}/{{$card1}}"
    files-map-card2-settings: &files_map_card2_settings
      source: "{{$cras-source}}/{{$card2}}"
      destination: "{{$cras-dest}}/{{$card2}}"
    files-map-dsp-ini: &files_map_dsp_ini
      source: "{{$cras-source}}/dsp.ini"
      destination: "{{$cras-dest}}/dsp.ini"
    files-map-card1-HiFi-conf: &files_map_card1_HiFi_conf
      source: "{{$ucm-source1}}/HiFi.conf"
      destination: "{{$ucm-dest1}}/HiFi.conf"
    files-map-card2-HiFi-conf: &files_map_card2_HiFi_conf
      source: "{{$ucm-source2}}/HiFi.conf"
      destination: "{{$ucm-dest2}}/HiFi.conf"
    files-map-card3-HiFi-conf: &files_map_card3_HiFi_conf
      source: "{{$ucm-source3}}/HiFi.conf"
      destination: "{{$ucm-dest3}}/HiFi.conf"
    files-map-card4-HiFi-conf: &files_map_card4_HiFi_conf
      source: "{{$ucm-source4}}/HiFi.conf"
      destination: "{{$ucm-dest4}}/HiFi.conf"
    files-map-card1-conf: &files_map_card1_conf
      source: "{{$ucm-source1}}/{{$card1}}.conf"
      destination: "{{$ucm-dest1}}/{{$card1}}.{{ucm-suffix}}.conf"
    files-map-card2-conf: &files_map_card2_conf
      source: "{{$ucm-source2}}/{{$card2}}.conf"
      destination: "{{$ucm-dest2}}/{{$card2}}.{{ucm-suffix}}.conf"
    files-map-card3-conf: &files_map_card3_conf
      source: "{{$ucm-source3}}/{{$card3}}.conf"
      destination: "{{$ucm-dest3}}/{{$card3}}.{{ucm-suffix}}.conf"
    files-map-card4-conf: &files_map_card4_conf
      source: "{{$ucm-source4}}/{{$card4}}.conf"
      destination: "{{$ucm-dest4}}/{{$card4}}.{{ucm-suffix}}.conf"
    files-map-board-ini: &files_map_board_ini
      source: "{{$cras-source}}/board.ini"
      destination: "{{$cras-dest}}/board.ini"

audio-common: &audio_common
  main:
    <<: *audio_main_common
    files:
      - *files_map_card1_settings
      - *files_map_card2_settings
      - *files_map_dsp_ini
      - *files_map_card1_HiFi_conf
      - *files_map_card2_HiFi_conf
      - *files_map_card3_HiFi_conf
      - *files_map_card4_HiFi_conf
      - *files_map_card1_conf
      - *files_map_card2_conf
      - *files_map_card3_conf
      - *files_map_card4_conf

audio-boardini-setting: &audio_boardini_setting
  main:
    <<: *audio_main_common
    files:
      - *files_map_card1_settings
      - *files_map_card2_settings
      - *files_map_dsp_ini
      - *files_map_card1_HiFi_conf
      - *files_map_card2_HiFi_conf
      - *files_map_card3_HiFi_conf
      - *files_map_card4_HiFi_conf
      - *files_map_card1_conf
      - *files_map_card2_conf
      - *files_map_card3_conf
      - *files_map_card4_conf
      - *files_map_board_ini