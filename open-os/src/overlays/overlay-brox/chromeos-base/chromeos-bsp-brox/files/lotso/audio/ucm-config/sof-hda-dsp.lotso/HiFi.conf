SectionDevice."Mic".0 {
	Value {
		CapturePCM "hw:sofhdadsp,0"
		CaptureMixerElem "Capture"
		IntrinsicSensitivity "-2300"
		JackDev "sof-hda-dsp Mic"
	}
	EnableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Capture Volume' 70%"
		cset "name='Capture Switch' on"
	]
	DisableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Capture Switch' off"
	]
}

