SectionVerb {
	Value {
		FullySpecifiedUCM "1"
	}
	EnableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Master Playback Volume' 100%"
		cset "name='Master Playback Switch' on"
		cset "name='Capture Switch' off"
		cset "name='Dmic0 Capture Switch' off"
		cset "name='Headphone Playback Switch' off"
		cset "name='Speaker Playback Switch' off"
	]
	DisableSequence [
	]
}

SectionDevice."Headphone".0 {
	Value {
		PlaybackPCM "hw:sofhdadsp,0"
		JackDev "sof-hda-dsp Headphone"
		PlaybackMixerElem "Headphone"
	}
	EnableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Headphone Playback Switch' on"
		cset-tlv "name='CODEC_ADAPTER30.0 Waves Codec Setup 30' /opt/waves/lotso/waves_params_headphone.bin"
	]
	DisableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Headphone Playback Switch' off"
	]
}

SectionDevice."Speaker".0 {
	Value {
		PlaybackPCM "hw:sofhdadsp,0"
