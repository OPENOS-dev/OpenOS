SectionVerb {
	Value {
		FullySpecifiedUCM "1"
	}
	EnableSequence [
		cdev "hw:sofhdadsp"
		cset "name='Master Playback Switch' on"
		cset "name='Master Playback Volume' 80"
		cset "name='Capture Volume' 57"
		cset "name='Mic Boost Volume' 2"
	]
	DisableSequence [
	]
}

