description   "Configure network to open necessary ports for labstation"
author        "chromium-os-dev@chromium.org"

start on started system-services

task
oom score -100   # Short script at startup; don't oom kill

script
  # Port 9100 is used for BOLS service.
  run_iptables() {
    iptables -w "$@" -A INPUT -p tcp --dport 9100 -j ACCEPT
  }

  run_iptables >&2
  IPTABLES_EC=$?

  if [ $IPTABLES_EC -ne 0 ]; then
    # Retry with verbose output from iptables on failure
    run_iptables -v >&2
    IPTABLES_EC=$?
  fi

  if [ $IPTABLES_EC -ne 0 ]; then
    echo "Listing current INPUT chain rules:" >&2
    iptables -w -L INPUT -n -v >&2
    logger -t "${UPSTART_JOB}" -p err "Failed to configure iptables for port 9100. Exit code: $IPTABLES_EC"
  fi

  exit $IPTABLES_EC
end script
