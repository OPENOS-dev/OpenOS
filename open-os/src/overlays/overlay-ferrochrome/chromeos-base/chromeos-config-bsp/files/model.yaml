ferrochrome-config: &ferrochrome_config
  name: ferrochrome
  brand-code: FERROCHROME
  hwid-override: FERROCHROME-NEXTGEN A6A-A5J
  firmware:
    no-firmware: True

# Required under for chromeos-config.
chromeos:
  devices:
    - skus:
        - config: *ferrochrome_config
