# OPENOS System Configuration
# This file controls OPENOS specific behavior

[general]
version=1.0.0
codename="Monitor"
channel=stable

[branding]
name=OPENOS
vendor=OCS (Open Code Studio)
logo=/usr/share/chromeos-assets/images/openos-logo_192.png
homepage=https://openos.org

[privacy]
# All Google tracking disabled by default
telemetry=false
crash_reporting=false
metrics=false
rlz_tracking=false
safe_browsing_local_only=true
network_prediction=false

[android]
enabled=true
container_type=arcvm
default_app_store=fdroid

[package_manager]
name=opt
config=/etc/opt/opt-repos.conf
