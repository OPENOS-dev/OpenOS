		CRASELDControlID "20"
	}
	EnableSequence [
		cdev "hw:sofmt8196tas256"
		cset "name='DPTX_OUT_MUX' 1"
		cset "name='DPTX_VIRTUAL_OUT_MUX' 1"
		cset "name='DPTX Playback Route' 'external display 1'"
