[package]
name = "libopt"
version = "0.1.0"
edition = "2021"
description = "OPENOS Desktop Package Manager - Core Library"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "libopt"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", features = ["gzip", "json"] }
dirs = "5"
