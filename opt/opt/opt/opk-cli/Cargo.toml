[package]
name = "opk"
version = "0.1.0"
edition = "2021"
authors = ["Open-OS Project <dev@openos.org>"]
description = "Open Package Keeper - apt-compatible package manager for Open-OS"
license = "GPL-3.0-or-later"
repository = "https://github.com/openeuler/OPENOS"
readme = "../README.md"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "color"] }
indicatif = "0.17"
console = "0.15"
colored = "2"
dialoguer = "0.11"

# HTTP client for repository fetching
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
ureq = { version = "2.10", features = ["json"] }  # lighter HTTP client fallback

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Archive handling
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
zip = "2.2"

# Hashing & crypto
sha2 = "0.10"

# System
dirs = "5.0"
walkdir = "2.5"
glob = "0.3"
regex = "1.11"
tempfile = "3.14"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
